apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - ../../base/immich/
    #  - immich-tls-secret.yaml

patches:
  - path: sleep-patch.yaml
  - target:
      version: v1
      group: postgresql.cnpg.io
      kind: Cluster
      name: immich-database
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      - op: add
        path: /spec/nodeMaintenanceWindow
        value:
          inProgress: true
          reusePVC: true
