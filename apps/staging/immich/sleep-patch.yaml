apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-app
spec:
  postRenderers:
    - kustomize:
        patches:

          - target:
              kind: Deployment
              name: immich-app-server
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: immich-app-server
              spec:
                replicas: 0

          - target:
              kind: Deployment
              name: immich-app-machine-learning
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: immich-app-machine-learning
              spec:
                replicas: 0

          - target:
              kind: Deployment
              name: immich-app-valkey
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: immich-app-valkey
              spec:
                replicas: 0
