apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  #namespace: linkding
  namespace: keda
spec:
  ingressClassName: traefik
  rules:
    - host: lds.antoine-richard.net
      http:
        paths:
          - backend:
              service:
                #name: linkding
                #name: keda-interceptor-proxy
                name: keda-add-ons-http-interceptor-proxy
                port:
                  #number: 9090
                  number: 8080
            path: /
            pathType: Prefix

