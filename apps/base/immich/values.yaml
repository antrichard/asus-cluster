apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-configmap
data:
  # The key name is important - it will be referenced in valuesFrom
  values.yaml: |
  controllers:
    main:
      containers:
        main:
          image:
            tag: v3.2.0
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: user
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: password
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: dbname

  valkey:
    enabled: true

  immich:
    persistence:
      library:
        existingClaim: immich-library-pvc
