apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc
  annotations:
    helm.toolkit.fluxcd.io/prune: "disabled"
    kustomize.toolkit.fluxcd.io/prune: "disabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: storage-retain
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-pvc
  annotations:
    helm.toolkit.fluxcd.io/prune: "disabled"
    kustomize.toolkit.fluxcd.io/prune: "disabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: storage-retain
  resources:
    requests:
      storage: 10Gi
