apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: immich-oci-repository
spec:
  interval: 24h
  url: oci://ghcr.io/immich-app/immich-charts/immich 
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "^https://github.com/immich-app/immich-charts.*$"
  ref:
    tag: "0.13.4"
