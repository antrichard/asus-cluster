apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-app
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: immich-oci-repository 
  values:

    # --- Shared settings applied to all components ---

    #server:
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: user
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: dbname
              DB_STORAGE_TYPE: 'HDD'

    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc
    

    # --- Valkey (Redis alternative) ---

    valkey:
      enabled: true
      persistence:
        data:
          # type: emptyDir
          # Optional: to keep job queues persistent, replace `type: emptyDir` above with:
          type: persistentVolumeClaim
          size: 1Gi
          accessMode: ReadWriteOnce


    # --- Server component ---

    server:
      ingress:
        main:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/redirect-entry-point: websecure
              #cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
            traefik.ingress.kubernetes.io/service.serverstransport: immich-timeout-transport@kubernetescrd
          hosts:
            - host: immich.antoine-richard.net
              paths:
                - path: "/"
                  service:
                    identifier: main
          tls:
            - secretName: wildcard-antoine-richard-net-tls
              hosts:
                - immich.antoine-richard.net


    # --- Machine learning component ---

    machine-learning:
      enabled: false
      persistence:
        cache:
          # type: emptyDir
          # Optional: to avoid downloading the ML models on every start, replace `type: emptyDir` above with:
          type: persistentVolumeClaim
          existingClaim: immich-ml-pvc
          # size: 10Gi
          # accessMode: ReadWriteOnce
          # storageClass: ""
          # storageClass: 
          #  name: local-path
          #  reclaimPolicy: Retain
