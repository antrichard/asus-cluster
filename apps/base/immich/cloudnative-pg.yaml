apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
spec:
  instances: 1

  storage:
    size: 1Gi

  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  # Immich uses advanced vector search for features like face recognition and semantic search.
  # Because of that, it requires PostgreSQL extensions that are not included in the default Postgres image.

  postgresql:
    shared_preload_libraries:
      - "vchord.so"

    # This extension is loaded via the Database CRD at cloudnative-pg-database.yaml
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/

  bootstrap:
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector CASCADE;
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube CASCADE;
         #    database: app
         #      owner: app
         #      postInitApplicationSQL:
         #        - CREATE EXTENSION vector CASCADE;
         #        - CREATE EXTENSION vchord CASCADE;
         #        - CREATE EXTENSION earthdistance CASCADE;
         #        - CREATE EXTENSION cube CASCADE;
