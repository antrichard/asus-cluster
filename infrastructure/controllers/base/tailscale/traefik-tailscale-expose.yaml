apiVersion: v1
kind: Service
metadata:
  name: traefik-tailscale
  namespace: kube-system
  annotations:
    ://tailscale.com: "true"
    ://tailscale.com: "traefik-asus-lab"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: https
      port: 443
      targetPort: websecure # 8443 or websecure (verify with kubectl get svc traefik -n kube-system -o yaml)
