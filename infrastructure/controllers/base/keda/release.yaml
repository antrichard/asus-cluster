apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda 
  namespace: keda
spec:
  interval: 30m
  chart:
    spec:
      chart: keda
      version: 2.21.1
      sourceRef:
        kind: HelmRepository
        name: kedacore
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-http-add-on
  namespace: keda
spec:
  interval: 1h
  dependsOn:
    - name: keda
  chart:
    spec:
      chart: keda-add-ons-http
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: kedacore
  values:
    interceptor:
      replicas:
        min: 1
        max: 1
    scaler:
      replicas: 1
