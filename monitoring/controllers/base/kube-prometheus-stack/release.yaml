apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.2.2"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      adminPassword: antoine 
      ingress:
        enabled: true
        
        ingressClassName: traefik

          ## Hostnames.
          ## Must be provided if Ingress is enable.
          ##
        hosts:
          - grs.antoine-richard.net

          ## TLS configuration for grafana Ingress
          ## Secret must be manually created in the namespace
          ##
        tls:
          - secretName: grafana-tls-secret
            hosts:
              - grs.antoine-richard.net

    prometheus:
      prometheusSpec:
        scrapeInterval: "60s" # default 30s
        evaluationInterval: "60s" # default ""
        retention: "12h" # default 10d
        resources:
          requests:
            cpu: "50m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "450Mi"
